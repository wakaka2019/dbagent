<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DBAgent管理</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #111827; background: #f7f7f8; }
		.header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #e5e7eb; }
		.header h1 { margin: 0; font-size: 18px; }
		.container { padding: 16px 20px; }
		.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
		.select, .input { height: 36px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; outline: none; }
		.btn { height: 36px; padding: 0 14px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; }
		.btn.primary { background: #10b981; color: #fff; border-color: #10b981; }
		.table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
		.table th, .table td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
		.table th { background: #f9fafb; text-align: left; color: #374151; }
		.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 6px; }
		.dot-running { background: #10b981; }
		.badge { background: #eef2ff; color: #3730a3; font-size: 12px; padding: 2px 6px; border-radius: 999px; }
		.actions { display: flex; gap: 8px; align-items: center; }
		.menu { position: relative; display: inline-block; }
		.menu-btn { height: 28px; padding: 0 10px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; font-size: 12px; }
		.menu-list { position: absolute; right: 0; top: calc(100% + 6px); width: 180px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: none; z-index: 100; }
		.menu.open .menu-list { display: block; }
		.menu-item { padding: 10px 12px; font-size: 13px; color: #111827; cursor: pointer; text-decoration: none; display: block; }
		.menu-item:hover { background: #f3f4f6; }
		.avatar { width: 20px; height: 20px; border-radius: 50%; background: #e5e7eb; display: inline-block; vertical-align: middle; margin-right: 6px; }
		.right { text-align: right; }
	</style>
</head>
<body>
	<div class="header">
		<h1>DBAgent管理</h1>
		<div>
			<button class="btn primary" onclick="gotoCreate()">创建智能体</button>
		</div>
	</div>
	<div class="container">
		<div class="toolbar">
			<select id="filterEnv" class="select" onchange="render()">
				<option value="">请选择环境</option>
				<option value="dev">dev</option>
				<option value="test">test</option>
				<option value="prod">prod</option>
			</select>
			<select id="filterUnit" class="select" onchange="render()">
				<option value="">请选择单元</option>
				<option value="default">default</option>
				<option value="quality_operations">quality_operations</option>
				<option value="cachecloud">cachecloud</option>
			</select>
			<select id="filterDB" class="select" onchange="render()">
				<option value="">请选择数据库</option>
				<option value="db_mysql">db_mysql</option>
				<option value="quality_operations">quality_operations</option>
				<option value="cachecloud">cachecloud</option>
			</select>
			<button class="btn" onclick="render()">查询</button>
		</div>

		<table class="table" id="tbl">
			<thead>
				<tr>
					<th style="width:60px;">id</th>
					<th>agent名称</th>
					<th>环境</th>
					<th>单元</th>
					<th>状态</th>
					<th>关联数据库名</th>
					<th>关联表名称</th>
					<th>负责人</th>
					<th>用途</th>
					<th class="right">操作</th>
				</tr>
			</thead>
			<tbody id="tbody"></tbody>
		</table>
	</div>

	<script>
		// 模拟数据
		const agents = [
			{ id: 15, name: 'lb-test', env: 'test', unit: 'default', status: 'running', db: 'db_mysql', table: 'ansible_playbook', owner: '罗斌', purpose: '测试' },
			{ id: 14, name: 'lc-test-10', env: 'test', unit: 'quality_operations', status: 'running', db: 'quality_operations', table: 't_dim_git_mr_info', owner: '刘畅', purpose: '1010101010' },
			{ id: 13, name: 'lc-test-09', env: 'test', unit: 'quality_operations', status: 'running', db: 'quality_operations', table: 't_dim_git_mr_info', owner: '刘畅', purpose: '999999999' },
			{ id: 12, name: 'lc-test-08', env: 'test', unit: 'quality_operations', status: 'running', db: 'quality_operations', table: 't_dim_git_mr_info', owner: '刘畅', purpose: '888888888' },
			{ id: 9,  name: 'redis-meta-agent', env: 'prod', unit: 'default', status: 'running', db: 'cachecloud', table: 'app_desc', owner: '由金龙', purpose: 'redis 元数据' }
		];

		function render() {
			const env = document.getElementById('filterEnv').value;
			const unit = document.getElementById('filterUnit').value;
			const db = document.getElementById('filterDB').value;
			const tbody = document.getElementById('tbody');
			tbody.innerHTML = '';
			
			agents
				.filter(a => !env || a.env === env)
				.filter(a => !unit || a.unit === unit)
				.filter(a => !db || a.db === db)
				.forEach(a => {
					const tr = document.createElement('tr');
					tr.innerHTML = `
						<td>${a.id}</td>
						<td>${a.name}</td>
						<td>${a.env}</td>
						<td>${a.unit}</td>
						<td><span class="status-dot dot-running"></span>运行中</td>
						<td>${a.db}</td>
						<td><span class="badge">${a.table}</span></td>
						<td><span class="avatar"></span>${a.owner}</td>
						<td>${a.purpose}</td>
						<td class="right">
							<div class="actions">
								<a class="btn" href="evaluate_model.html" title="DBAgent问数">DBAgent问数</a>
								<div class="menu">
									<button class="menu-btn" onclick="toggleMenu(this)">配置 ▾</button>
									<div class="menu-list">
										<a class="menu-item" href="create_agent.html" onclick="prefillCreate(${a.id})">表配置</a>
										<a class="menu-item" href="prototype_wireframe.html" onclick="persistAgent(${a.id})">表和字段注释配置</a>
										<a class="menu-item" href="template_config.html" onclick="persistAgent(${a.id})">问题模板配置</a>
										<a class="menu-item" href="config_table.html" onclick="persistAgent(${a.id})">自定义配置</a>
										<a class="menu-item" href="model_management.html" onclick="persistAgent(${a.id})">模型管理</a>
										<a class="menu-item" href="evaluate_model.html" onclick="persistAgent(${a.id})">模型评测</a>
									</div>
								</div>
							</div>
						</td>
					`;
					tbody.appendChild(tr);
				});
		}

		function toggleMenu(btn) {
			const menu = btn.parentElement;
			const opened = document.querySelector('.menu.open');
			if (opened && opened !== menu) opened.classList.remove('open');
			menu.classList.toggle('open');
		}

		// 点击外部关闭菜单
		document.addEventListener('click', function(e) {
			const anyOpen = document.querySelector('.menu.open');
			if (!anyOpen) return;
			if (!anyOpen.contains(e.target)) anyOpen.classList.remove('open');
		});

		function gotoCreate() { window.location.href = 'create_agent.html'; }

		// 进入子页面时携带当前选择的agent（通过localStorage）
		function persistAgent(id) {
			const agent = agents.find(a => a.id === id);
			if (!agent) return;
			localStorage.setItem('current_agent', JSON.stringify(agent));
		}

		// 表配置：写入需要回填的数据并跳转到新建页
		function prefillCreate(id) {
			const agent = agents.find(a => a.id === id);
			if (!agent) return;
			const payload = {
				agentName: agent.name,
				environment: agent.env,
				unit: agent.unit,
				databaseName: agent.db,
				dataServiceType: 'mysql',
				selectedTables: agent.table ? [agent.table] : [],
				businessDescription: agent.purpose || ''
			};
			localStorage.setItem('agent_form_data', JSON.stringify(payload));
			localStorage.setItem('agent_edit_mode', '1');
		}

		document.addEventListener('DOMContentLoaded', render);
	</script>
</body>
</html>
